<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migraci&#243;n &#183; Solralol</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#f4f1e8;font:14px "Segoe UI",Arial,sans-serif}.shell{padding:27px 30px}.brand-row{display:flex;align-items:center;justify-content:space-between}.brand{color:#dfbd69;font-size:12px;font-weight:800;letter-spacing:.2em}.close-button{width:30px;height:30px;padding:0;border:1px solid #45434b;border-radius:8px;background:#242329;color:#d8d5dc;font-size:21px;line-height:1;display:grid;place-items:center}.close-button:hover:not(:disabled){background:#39363d;color:#fff;border-color:#77717b}.close-button:disabled{opacity:.38;cursor:not-allowed}.card{margin-top:17px;padding:23px;border:1px solid #36343a;border-radius:16px;background:#19191f;box-shadow:0 15px 45px #0005}h1{font-size:21px;margin:7px 0 19px}.phase{font-size:14px;color:#e1c16f;font-weight:700}.paths{display:grid;gap:11px;margin:18px 0}.path{color:#aaa8b0;font-size:12px}.path strong{display:block;color:#eee;margin-top:4px;overflow-wrap:anywhere;font-size:13px;font-weight:500}.bar{height:9px;border-radius:8px;background:#34323a;overflow:hidden;margin:18px 0 9px}.fill{height:100%;width:2%;background:linear-gradient(90deg,#b48c37,#f1d57c);transition:width .2s}.details{display:flex;justify-content:space-between;color:#b9b6bf;font-size:12px}.activity{height:22px;margin-top:15px;color:#aaa8b0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.error{margin-top:13px;color:#ffb5a8;line-height:1.45}.actions{display:flex;gap:10px;margin-top:19px}button{border:0;border-radius:9px;padding:10px 15px;font-weight:700;cursor:pointer;background:#d6b25c;color:#1b1710}button.secondary{background:#302f35;color:#eee}.foot{margin-top:14px;color:#898791;font-size:11px;line-height:1.4}.hidden{display:none!important}
</style></head>
<body><main class="shell"><div class="brand-row"><div class="brand">SOLRALOL</div><button id="closeAssistant" class="close-button" type="button" aria-label="Cerrar asistente" title="La migraci&#243;n debe terminar antes de cerrar" disabled>&times;</button></div><section class="card">
<h1 id="heading">Migrando datos de la aplicaci&#243;n</h1><div id="phase" class="phase">Preparando migraci&#243;n&#8230;</div>
<div class="paths"><div class="path">Origen<strong id="source"></strong></div><div class="path">Destino<strong id="destination"></strong></div></div>
<div class="bar"><div id="fill" class="fill"></div></div><div class="details"><span id="bytes">Preparando archivos&#8230;</span><span id="files"></span></div><div id="activity" class="activity"></div><div id="error" class="error hidden"></div>
<div id="actions" class="actions hidden"><button id="retry">Reintentar</button><button id="sourceButton" class="secondary">Iniciar con ubicaci&#243;n original</button></div>
<div id="success" class="actions hidden"><span id="successText">Los datos se han trasladado correctamente. Solralol utilizar&#225; la nueva ubicaci&#243;n.</span><button id="start">Iniciar Solralol</button></div>
<div class="foot">La carpeta original se conserva como respaldo. No cierres Windows durante la comprobaci&#243;n de los archivos.</div>
</section></main><script>
const el=(id)=>document.getElementById(id),api=window.migrationAssistant;
const labels={assistant_ready:'Preparando migraci\u00f3n',waiting_for_shutdown:'Cerrando Solralol',closing:'Cerrando Solralol',validating:'Verificando archivos',copying:'Copiando datos',verifying:'Comprobando integridad',committing:'Configurando nueva ubicaci\u00f3n',complete:'Migraci\u00f3n completada',startup_verified:'Inicio de Solralol verificado',startup_failed:'No se pudo iniciar Solralol con la nueva ubicaci\u00f3n',failed:'No se pudo completar la migraci\u00f3n',recovery_required:'Se requiere recuperar la migraci\u00f3n',launching_source:'Iniciando con la ubicaci\u00f3n original'};
function fmt(n){if(!Number.isFinite(n))return '0 B';const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${units[i]}`}
function render(s){if(!s)return;el('heading').textContent=s.state==='complete'||s.state==='startup_verified'?'Migraci\u00f3n completada':s.state==='startup_failed'?'No se pudo iniciar Solralol':'Migrando datos de la aplicaci\u00f3n';el('source').textContent=s.source||'';el('destination').textContent=s.destination||'';el('phase').textContent=labels[s.phase]||s.message||'Preparando migraci\u00f3n';const total=s.totalBytes||0,current=s.currentBytes||0;el('bytes').textContent=total?`${fmt(current)} de ${fmt(total)}`:(s.message||'Preparando archivos\u2026');el('files').textContent=s.fileCount?`${s.processedFiles||0} / ${s.fileCount} archivos`:'';el('fill').style.width=total?`${Math.min(100,current/total*100)}%`:(['copying','verifying','committing'].includes(s.state)?'3%':'0%');el('activity').textContent=s.currentFile||s.message||'';const failed=['failed','recovery_required','startup_failed'].includes(s.state);const finished=['complete','startup_verified','failed','recovery_required','startup_failed'].includes(s.state);el('closeAssistant').disabled=!finished;el('closeAssistant').title=finished?'Cerrar asistente':'La migraci\u00f3n debe terminar antes de cerrar';el('error').textContent=failed?(s.error||s.message||'La ubicaci\u00f3n original permanece activa.'):'';el('error').classList.toggle('hidden',!failed);el('actions').classList.toggle('hidden',!failed);el('success').classList.toggle('hidden',s.state!=='complete');}
api.onStatus(render);api.ready();el('closeAssistant').onclick=()=>api.action('close');el('retry').onclick=()=>api.action('retry');el('sourceButton').onclick=()=>api.action('launch-source');el('start').onclick=()=>api.action('launch-destination');
</script></body></html>
